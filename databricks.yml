# This is a Declarative Automation Bundle definition for nyc_taxi_pipline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyc_taxi_pipline
  uuid: 27462e5b-4630-471c-9d07-968e1d1e19b0

include:
  - resources/*.yml
  - resources/*/*.yml



# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-84ba4501-0f99.cloud.databricks.com
    variables:
      catalog: assetbundles
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-84ba4501-0f99.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/omarelsoudy36@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/omarelsoudy36@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: assetbundles
      schema: prod
    permissions:
      - group_name: admin
        level: CAN_MANAGE
